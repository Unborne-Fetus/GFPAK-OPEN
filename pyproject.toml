[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "gfpak-open"
version = "0.1.0"
description = "Read-only GFLXPACK archive inspector and resource exporter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
lz4 = ["lz4>=4"]

[project.scripts]
gfpak-open = "gfpak_open.cli:main"
gfpak-open-gui = "gfpak_open.gui:main"

[tool.setuptools.packages.find]
include = ["gfpak_open*"]
