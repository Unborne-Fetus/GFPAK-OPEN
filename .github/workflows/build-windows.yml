name: Build Windows Model Converter
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native NCA reader crypto dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=44,<48" "zstandard>=0.23,<1" "lz4>=4,<5"
      - name: Test archive reader and model converter
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build portable EXE through run.bat
        shell: cmd
        run: call run.bat --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: GFPAK-OPEN-Windows
          path: dist/GFPAK-OPEN.exe
