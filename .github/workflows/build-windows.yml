name: Build Windows Model Converter
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test archive reader and model converter
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build offline 3D studio assets
        run: |
          npm install
          $env:GFPAK_DESKTOP = '1'
          npm run build
      - name: Build Windows GUI EXE
        run: |
          python -m pip install pyinstaller pywebview pyooz==0.0.8
          python -c "import ooz; assert hasattr(ooz, 'decompress')"
          python -m PyInstaller --onefile --windowed --name GFPAK-OPEN --collect-all webview --hidden-import ooz --add-data "dist-desktop;web_dist" --add-data "gfpak_open/blender_worker.py;gfpak_open" launch.py
      - uses: actions/upload-artifact@v4
        with:
          name: GFPAK-OPEN-Windows
          path: dist/GFPAK-OPEN.exe
