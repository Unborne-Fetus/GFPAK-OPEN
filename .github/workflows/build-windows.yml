name: Build Windows Model Converter
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test archive reader and model converter
        run: python -m unittest discover -s tests -v
      - name: Build Windows GUI EXE
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --windowed --name GFPAK-OPEN --add-data "gfpak_open/blender_worker.py;gfpak_open" launch.py
      - uses: actions/upload-artifact@v4
        with:
          name: GFPAK-OPEN-Windows
          path: dist/GFPAK-OPEN.exe
